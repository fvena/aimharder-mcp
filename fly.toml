# Fly.io configuration for one personal aimharder-mcp instance. See docs/remote.md.
# Secrets (AimHarder login, MCP_PUBLIC_URL, MCP_OWNER_SECRET, optional AIMHARDER_*) are set with `fly secrets`.
# Run exactly one machine: sessions and preview references live in memory.

app = 'aimharder-mcp'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Suspend when idle instead of stopping: memory (AimHarder sessions, pending previews) survives and wake-up is fast.
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    method = 'GET'
    path = '/healthz'
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
